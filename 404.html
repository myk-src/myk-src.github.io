<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYK.O.S - Kernel Panic</title>
  <style>
    body {
      background-color: #000000;
      color: #aaaaaa;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.2;
      padding: 16px;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  </style>
  <script type="text/javascript">
    // Grab the URL the user was trying to reach
    var badPath = window.location.pathname;

    // Immediately redirect to the Vue app, passing the crash flag in the URL
    window.location.replace(
      window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port : '') + 
      '/' + '/?crashed=true&path=' + encodeURIComponent(badPath)
    );
  </script>
</head>
<body>
  <!-- This is only visible for a split second while the redirect fires -->
  <pre>
[    0.000000] Booting MYK.O.S...
[    0.000014] ERROR: Route unresolved. 
[    0.000021] Redirecting to kernel crash handler...
  </pre>
</body>
</html>
